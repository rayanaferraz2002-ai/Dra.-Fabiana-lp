body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FFF5EC;color:#3A2626;font:400 16px/1.65 Montserrat,system-ui,sans-serif;text-align:center}

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHCNXTJ3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<main>
 <img class="logo" src="/implantodontia-lp/assets/img/logo-vinho.png" width="480" height="103" alt="Dra. Fabiana Marques Odontologia">
 <h1>Recebemos seu contato</h1>
 <p id="txt">A equipe da Dra. Fabiana Marques vai falar com você em breve para combinar o melhor horário.</p>
 <p id="txt2">Se preferir, adiante o atendimento pelo WhatsApp:</p>
 <a class="btn wa" id="wa" href="#" rel="noopener">Falar pelo WhatsApp</a>
 <a class="btn ln" href="/implantodontia-lp/">Voltar à página</a>
 <small>Dra. Fabiana Marques · CRO-SP 58.746</small>
</main>
<script>
(function(){
 var dl=window.dataLayer=window.dataLayer||[];
 function wa(m){return 'https://wa.me/5511948246888?text='+encodeURIComponent(m)}
 var btn=document.getElementById('wa');
 btn.href=wa('Olá! Acabei de enviar meus dados pelo site e gostaria de agendar uma avaliação.');
 // A conversão só é registrada se a pessoa realmente enviou o formulário nesta sessão.
 // Quem chega aqui por busca, link direto ou recarregando a página não gera conversão nem é levado ao WhatsApp.
 var ok=false,m='';
 try{ok=sessionStorage.getItem('lp_lead')==='1';m=sessionStorage.getItem('lp_wa')||'';sessionStorage.removeItem('lp_lead');sessionStorage.removeItem('lp_wa')}catch(e){}
 if(!ok)return;
 if(!m){dl.push({event:'lead_confirmado'});return}
 // Abre o WhatsApp com as respostas depois que o GTM termina de registrar a conversão (no máximo 2 s).
 var url=wa(m),gone=false;
 function go(){if(gone)return;gone=true;location.href=url}
 btn.href=url;btn.textContent='Abrir o WhatsApp';
 document.getElementById('txt').textContent='Estamos abrindo o WhatsApp com as suas respostas. É só tocar em enviar para falar com a equipe.';
 document.getElementById('txt2').textContent='Se o WhatsApp não abrir sozinho, toque no botão:';
 dl.push({event:'lead_confirmado',eventCallback:go,eventTimeout:2000});
 setTimeout(go,2500);
})();
</script>
