<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">

<script>window.dataLayer=window.dataLayer||[];</script>
{{GTM_HEAD}}
<style>
{{FONT_CSS}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FFF5EC;color:#3A2626;font:400 16px/1.6 Montserrat,system-ui,sans-serif;text-align:center}
main{max-width:460px}
h1{margin:0 0 .6rem;color:#753E3E;font-size:1.7rem;line-height:1.2}
p{margin:0 0 1.1rem;color:#6B5555}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 22px;border-radius:12px;font:600 1rem Montserrat,system-ui,sans-serif;text-decoration:none;margin-top:12px}
.wa{background:#0A7D40;color:#fff}
.ln{border:2px solid #753E3E;color:#753E3E}
small{display:block;margin-top:22px;color:#6B5555}
</style>
</head>
<body>
{{GTM_BODY}}
<main>
 <h1>Recebemos seu contato</h1>
 <p>A equipe da Dra. Fabiana Marques vai falar com você em breve para combinar o melhor horário.</p>
 <p>Se preferir, adiante o atendimento pelo WhatsApp:</p>
 <a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">Falar pelo WhatsApp</a>
 <a class="btn ln" href="/implantodontia-lp/">Voltar à página</a>
 <small>Dra. Fabiana Marques · CRO-SP 58.746</small>
</main>
<script>
(function(){
 var dl=window.dataLayer=window.dataLayer||[];
 document.getElementById('wa').href='https://wa.me/5511948246888?text='+encodeURIComponent('Olá! Acabei de enviar meus dados pelo site e gostaria de agendar uma avaliação.');
 // A conversão só é registrada se a pessoa realmente enviou o formulário nesta sessão.
 // Quem chega aqui por busca ou link direto não gera conversão.
 var ok=false;
 try{ok=sessionStorage.getItem('lp_lead')==='1';sessionStorage.removeItem('lp_lead')}catch(e){}
 if(ok)dl.push({event:'lead_confirmado'});
})();
</script>
</body>
</html>
